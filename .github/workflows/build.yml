name: Rakennus

# Ajaa koko Build-iRequire.ps1:n oikealla Windowsilla: ADK + WinPE,
# virallinen ISO, DISM-muokkaukset, eheysmanifesti ja ISO-levykuva.
# Sen jalkeen Test-BuildOutput.ps1 liittaa kuvat vain luku -tilassa ja
# tarkistaa sisallon. Raskas (~5 Gt lataus, 30-60 min), joten ajetaan
# vain kun rakennukseen liittyvat tiedostot muuttuvat tai kasin.
on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: 'Windows-ISOn osoite (oletus: Microsoftin IoT Enterprise LTSC 2024 Evaluation x64 en-us)'
        required: false
        default: 'https://software-static.download.prss.microsoft.com/dbazure/998969d5-f34g-4e03-ac9d-1f9786c66749/26100.1742.240906-0331.ge_release_svc_refresh_CLIENT_IOT_LTSC_EVAL_x64FRE_en-us.iso'
      iso_sha256:
        description: 'ISOn SHA-256 (tarkistetaan ennen kayttoa)'
        required: false
        default: '2cee70bd183df42b92a2e0da08cc2bb7a2a9ce3a3841955a012c0f77aeb3cb29'
      update_rounds:
        description: 'Windows Update -kierroksia paasta paahan -testissa (0 = nopea ajo ilman paivityksia)'
        required: false
        default: '0'

# Uusi push samaan haaraan peruu vanhan, kesken olevan ajon (Actions-minuutit).
concurrency:
  group: rakennus-${{ github.ref }}
  cancel-in-progress: true
  schedule:
    # Viikoittain: sama ketju Windows Updaten kanssa. Nain huomataan jos
    # Microsoftin uusi paivitys rikkoo jotain, vaikka koodi ei muuttuisi.
    - cron: '17 2 * * 0'
  push:
    paths:
      - 'Build/**'
      - 'WinPE/Bootstrap.ps1'
      - 'WinPE/winpeshl.ini'
      - 'Policies/defaultuser.txt'
      - 'Policies/Debloat.json'
      - 'Tests/Test-BuildOutput.ps1'
      - 'Tests/e2e/**'
      - '.github/workflows/build.yml'

env:
  ISO_URL: ${{ github.event.inputs.iso_url || 'https://software-static.download.prss.microsoft.com/dbazure/998969d5-f34g-4e03-ac9d-1f9786c66749/26100.1742.240906-0331.ge_release_svc_refresh_CLIENT_IOT_LTSC_EVAL_x64FRE_en-us.iso' }}
  ISO_SHA256: ${{ github.event.inputs.iso_sha256 || '2cee70bd183df42b92a2e0da08cc2bb7a2a9ce3a3841955a012c0f77aeb3cb29' }}
  # Ajastettu ajo: yksi paivityskierros. Push: ei paivityksia (nopea).
  UPDATE_ROUNDS: ${{ github.event.inputs.update_rounds || (github.event_name == 'schedule' && '1') || '0' }}

jobs:
  build:
    name: Rakenna ja tarkista media
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Lataa ISO ja tarkista tiiviste
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path D:\irq -Force | Out-Null
          & curl.exe -L --fail --retry 3 --silent --show-error -o D:\irq\windows.iso $env:ISO_URL
          if ($LASTEXITCODE -ne 0) { throw "Lataus epaonnistui ($LASTEXITCODE)" }
          $h = (Get-FileHash -Algorithm SHA256 D:\irq\windows.iso).Hash
          Write-Host "SHA-256: $h"
          if ($h -ne $env:ISO_SHA256.ToUpper()) { throw "Tiiviste ei tasmaa: odotettiin $env:ISO_SHA256" }

      - name: Asenna Windows ADK (Deployment Tools) ja WinPE-lisaosa
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & curl.exe -L --fail --retry 3 --silent --show-error -o D:\irq\adksetup.exe 'https://go.microsoft.com/fwlink/?linkid=2289980'
          & curl.exe -L --fail --retry 3 --silent --show-error -o D:\irq\adkwinpesetup.exe 'https://go.microsoft.com/fwlink/?linkid=2289981'
          foreach ($f in @('D:\irq\adksetup.exe', 'D:\irq\adkwinpesetup.exe')) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw "$f allekirjoitus ei kelpaa" }
          }
          $p = Start-Process D:\irq\adksetup.exe -ArgumentList '/quiet /norestart /features OptionId.DeploymentTools' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "ADK: $($p.ExitCode)" }
          $p = Start-Process D:\irq\adkwinpesetup.exe -ArgumentList '/quiet /norestart /features OptionId.WindowsPreinstallationEnvironment' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WinPE: $($p.ExitCode)" }

      - name: Rakenna media (Build-iRequire.ps1)
        shell: powershell
        run: .\Build\Build-iRequire.ps1 -IsoPath D:\irq\windows.iso -WorkDir D:\irq\out

      - name: Tarkista media sisaltapain (Test-BuildOutput.ps1)
        shell: powershell
        run: .\Tests\Test-BuildOutput.ps1 -MediaDir D:\irq\out\Media -MountDir D:\irq\tarkistus

      - name: Tee ISO-levykuva (New-iRequireIso.ps1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\Build\New-iRequireIso.ps1 -MediaDir D:\irq\out\Media -IsoPath D:\irq\out\iRequire.iso
          $iso = Get-Item D:\irq\out\iRequire.iso
          Write-Host ("ISO: {0:N1} Gt" -f ($iso.Length / 1GB))
          if ($iso.Length -lt 1GB) { throw 'ISO on epailyttavan pieni' }

      - name: Paasta paahan -testin ISO (sama media, testiasetukset)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tests\e2e\Set-E2eConfig.ps1 -MediaDir D:\irq\out\Media -UpdateRounds ([int]$env:UPDATE_ROUNDS)
          # Eheys pysyy: asetukset eivat kuulu manifestiin.
          . .\Lib\Common.ps1; . .\Lib\Media.ps1
          $p = Test-MediaManifest -MediaRoot D:\irq\out\Media
          if ($p.Count -gt 0) { throw ('manifesti: ' + ($p -join '; ')) }
          New-Item -ItemType Directory -Path iso -Force | Out-Null
          .\Build\New-iRequireIso.ps1 -MediaDir D:\irq\out\Media -IsoPath (Join-Path $PWD 'iso\iRequire.iso')

      - uses: actions/cache/save@v5
        with:
          path: iso/iRequire.iso
          key: irequire-iso-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

      - name: Talleta rakennusloki
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rakennusloki
          path: D:\irq\out\build.log
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Paasta paahan (QEMU/KVM, koko ketju ilman ihmista)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache/restore@v5
        with:
          path: iso/iRequire.iso
          key: irequire-iso-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: KVM ja tyokalut
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm || { echo 'KVM ei ole kaytettavissa tassa ajurissa'; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools libguestfs-tools socat netpbm tesseract-ocr imagemagick >/dev/null
          sudo chmod 0644 /boot/vmlinuz-* || true
          # Ajurissa on vain ~14 Gt vapaata. Windows-asennus tarvitsee ~15 Gt,
          # joten poistetaan esiasennetut tyokalut joita tama ajo ei kayta.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / /mnt
          free -m

      - name: Aja koko ketju virtuaalikoneessa
        run: |
          # Tyokansio sille levylle, jolla on eniten tilaa.
          root_free=$(df --output=avail -k / | tail -1); mnt_free=$(df --output=avail -k /mnt | tail -1)
          if [ "$mnt_free" -gt "$root_free" ]; then base=/mnt; else base=$HOME; fi
          sudo mkdir -p "$base/e2e" && sudo chown "$USER" "$base/e2e"
          ln -sfn "$base/e2e" /tmp/e2e
          echo "Tyokansio: $base/e2e"
          # Paivitykset (kumulatiivinen paivitys ladataan ja asennetaan) vievat tunteja.
          if [ "$UPDATE_ROUNDS" != "0" ]; then export E2E_TIMEOUT_MIN=300 E2E_EXPECT_UPDATES=1; fi
          bash Tests/e2e/run-e2e.sh "$GITHUB_WORKSPACE/iso/iRequire.iso" "$base/e2e"

      - name: Talleta lokit ja kuvakaappaukset
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-tulokset
          path: |
            /tmp/e2e/out/
            /tmp/e2e/shots/*.png
          if-no-files-found: warn
          retention-days: 7
