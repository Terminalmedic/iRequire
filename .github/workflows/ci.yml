name: CI

# Ajetaan oikealla Windowsilla (PowerShell 5.1, sama kuin WinPE:ssa).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tarkistukset (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer-moduuli
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      # Sama skripti jota kaytetaan paikallisesti: tarkistukset + analyysi.
      - name: Tarkistukset ja analyysi (Tests/Invoke-Checks.ps1)
        shell: powershell
        run: .\Tests\Invoke-Checks.ps1 -RequireAnalyzer
